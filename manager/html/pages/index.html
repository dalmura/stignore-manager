<!DOCTYPE html>
<html lang="en-AU">
    {% include "utils/head.html" %}
    <body>
        {% include "components/navbar.html" %}
        <div class="container-fluid" hx-get="/components/itemlist.html" hx-trigger="load">
            <!-- Skeleton screen placeholder displayed while itemlist loads -->
            <div class="skeleton-browser-placeholder fade-in py-2">
                <div class="row align-items-center mb-3">
                    <div class="col-md-6 d-flex align-items-center gap-3">
                        <span class="skeleton-box skeleton-text-lg" style="width: 160px;"></span>
                        <div class="d-flex gap-2">
                            <span class="skeleton-box skeleton-pill" style="width: 70px;"></span>
                            <span class="skeleton-box skeleton-pill" style="width: 130px;"></span>
                            <span class="skeleton-box skeleton-pill" style="width: 80px;"></span>
                        </div>
                    </div>
                    <div class="col-md-6 text-end">
                        <span class="skeleton-box skeleton-text d-inline-block" style="width: 220px;"></span>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <div class="skeleton-list-group">
                            <div class="skeleton-item">
                                <div class="d-flex align-items-center gap-2 flex-grow-1">
                                    <span class="skeleton-box skeleton-icon"></span>
                                    <span class="skeleton-box skeleton-text" style="width: 60%;"></span>
                                </div>
                                <span class="skeleton-box skeleton-pill"></span>
                            </div>
                            <div class="skeleton-item">
                                <div class="d-flex align-items-center gap-2 flex-grow-1">
                                    <span class="skeleton-box skeleton-icon"></span>
                                    <span class="skeleton-box skeleton-text" style="width: 75%;"></span>
                                </div>
                                <span class="skeleton-box skeleton-pill"></span>
                            </div>
                            <div class="skeleton-item">
                                <div class="d-flex align-items-center gap-2 flex-grow-1">
                                    <span class="skeleton-box skeleton-icon"></span>
                                    <span class="skeleton-box skeleton-text" style="width: 45%;"></span>
                                </div>
                                <span class="skeleton-box skeleton-pill"></span>
                            </div>
                            <div class="skeleton-item">
                                <div class="d-flex align-items-center gap-2 flex-grow-1">
                                    <span class="skeleton-box skeleton-icon"></span>
                                    <span class="skeleton-box skeleton-text" style="width: 80%;"></span>
                                </div>
                                <span class="skeleton-box skeleton-pill"></span>
                            </div>
                            <div class="skeleton-item">
                                <div class="d-flex align-items-center gap-2 flex-grow-1">
                                    <span class="skeleton-box skeleton-icon"></span>
                                    <span class="skeleton-box skeleton-text" style="width: 50%;"></span>
                                </div>
                                <span class="skeleton-box skeleton-pill"></span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 d-none d-md-block">
                        <div class="skeleton-list-group opacity-75">
                            <div class="skeleton-item">
                                <div class="d-flex align-items-center gap-2 flex-grow-1">
                                    <span class="skeleton-box skeleton-icon"></span>
                                    <span class="skeleton-box skeleton-text" style="width: 70%;"></span>
                                </div>
                                <span class="skeleton-box skeleton-pill"></span>
                            </div>
                            <div class="skeleton-item">
                                <div class="d-flex align-items-center gap-2 flex-grow-1">
                                    <span class="skeleton-box skeleton-icon"></span>
                                    <span class="skeleton-box skeleton-text" style="width: 55%;"></span>
                                </div>
                                <span class="skeleton-box skeleton-pill"></span>
                            </div>
                            <div class="skeleton-item">
                                <div class="d-flex align-items-center gap-2 flex-grow-1">
                                    <span class="skeleton-box skeleton-icon"></span>
                                    <span class="skeleton-box skeleton-text" style="width: 65%;"></span>
                                </div>
                                <span class="skeleton-box skeleton-pill"></span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 d-none d-md-block">
                        <div class="skeleton-list-group opacity-50">
                            <div class="skeleton-item">
                                <div class="d-flex align-items-center gap-2 flex-grow-1">
                                    <span class="skeleton-box skeleton-icon"></span>
                                    <span class="skeleton-box skeleton-text" style="width: 50%;"></span>
                                </div>
                                <span class="skeleton-box skeleton-pill"></span>
                            </div>
                            <div class="skeleton-item">
                                <div class="d-flex align-items-center gap-2 flex-grow-1">
                                    <span class="skeleton-box skeleton-icon"></span>
                                    <span class="skeleton-box skeleton-text" style="width: 80%;"></span>
                                </div>
                                <span class="skeleton-box skeleton-pill"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Agent Details Modal -->
        <div class="modal fade" id="agentModal" tabindex="-1" aria-labelledby="agentModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="agentModalLabel">Agent Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="agentModalBody">
                        <!-- Skeleton placeholder while modal content is fetched -->
                        <div class="skeleton-modal-placeholder py-1">
                            <div class="d-flex align-items-center mb-3 gap-2">
                                <span class="skeleton-box skeleton-icon"></span>
                                <span class="skeleton-box skeleton-text-lg" style="width: 160px;"></span>
                            </div>
                            <div class="mb-3 d-flex align-items-center gap-2">
                                <span class="skeleton-box skeleton-text-sm" style="width: 90px;"></span>
                                <span class="skeleton-box skeleton-badge"></span>
                            </div>
                            <div class="mb-3 d-flex align-items-center gap-2">
                                <span class="skeleton-box skeleton-text-sm" style="width: 60px;"></span>
                                <span class="skeleton-box skeleton-badge" style="width: 70px;"></span>
                            </div>
                            <div class="skeleton-list-group mt-3">
                                <div class="skeleton-item">
                                    <span class="skeleton-box skeleton-text" style="width: 55%;"></span>
                                    <span class="skeleton-box skeleton-pill"></span>
                                </div>
                                <div class="skeleton-item">
                                    <span class="skeleton-box skeleton-text" style="width: 70%;"></span>
                                    <span class="skeleton-box skeleton-pill"></span>
                                </div>
                                <div class="skeleton-item">
                                    <span class="skeleton-box skeleton-text" style="width: 40%;"></span>
                                    <span class="skeleton-box skeleton-pill"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="alert alert-warning">
                            <strong>Warning:</strong> This action cannot be undone.
                        </div>
                        <p><strong>Agent:</strong> <span id="deleteAgentName"></span></p>
                        <p><strong>Item to delete:</strong> <span id="deleteItemName"></span></p>
                        <div id="deleteItemDetails">
                            <!-- Item details will be loaded here -->
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast Container -->
        <div aria-live="polite" aria-atomic="true" class="position-relative">
            <div class="toast-container position-fixed top-0 end-0 p-3">
                <!-- Toasts will be inserted here -->
            </div>
        </div>

        {% include "utils/footer.html" %}
        {% include "utils/scripts.html" %}
    </body>
</html>
