<script>
function refreshItemData() {
    const activeInfoPanel = document.getElementById('info-panel');
    const activeItemPathInputs = activeInfoPanel ? activeInfoPanel.querySelectorAll('input[name="item_path"]') : [];
    const activeItemPaths = Array.from(activeItemPathInputs).map(input => input.value).filter(val => val !== '');

    fetch('/components/itemlist.html')
        .then(response => response.text())
        .then(html => {
            const browserContainer = document.getElementById('file-browser-container');
            if (browserContainer) {
                browserContainer.innerHTML = html;
                if (typeof htmx !== 'undefined') {
                    htmx.process(browserContainer);
                }

                if (activeItemPaths.length > 0) {
                    fetch('/components/infopanel.html', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            item_path: activeItemPaths
                        })
                    })
                    .then(res => res.text())
                    .then(infoHtml => {
                        const infoPanel = document.getElementById('info-panel');
                        if (infoPanel) {
                            infoPanel.innerHTML = infoHtml;
                            if (typeof htmx !== 'undefined') {
                                htmx.process(infoPanel);
                            }
                        }
                    })
                    .catch(err => console.error('Failed to refresh info panel:', err));
                }

                if (typeof restoreSelectionFromUrl === 'function') {
                    setTimeout(restoreSelectionFromUrl, 200);
                }
            } else {
                window.location.reload();
            }
        })
        .catch(err => {
            console.error('Soft refresh failed, falling back to page reload:', err);
            window.location.reload();
        });
}

function showToast(message, type = 'success', options = {}) {
    const toastContainer = document.querySelector('.toast-container');
    const toastId = 'toast-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

    const bgClass = type === 'success' ? 'bg-dark text-white border-success' : 'bg-dark text-white border-danger';
    const headerBg = type === 'success' ? 'text-success' : 'text-danger';
    const icon = type === 'success' ? '✓' : '✕';

    let actionButtonHtml = '';
    if (options.actionText && typeof options.onAction === 'function') {
        actionButtonHtml = `
            <div class="mt-2 pt-2 border-top border-secondary d-flex justify-content-between align-items-center">
                <span class="small text-muted">Undo action?</span>
                <button type="button" class="btn btn-sm btn-outline-warning text-white fw-bold toast-action-btn">
                    ↩ ${escapeHtml(options.actionText)}
                </button>
            </div>
        `;
    }

    const toastHtml = `
        <div id="${toastId}" class="toast ${bgClass} shadow-lg border" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header bg-dark ${headerBg} border-0">
                <strong class="me-auto">${icon} ${type === 'success' ? 'Success' : 'Notice'}</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                <div>${message}</div>
                ${actionButtonHtml}
            </div>
        </div>
    `;

    toastContainer.insertAdjacentHTML('beforeend', toastHtml);

    const toastElement = document.getElementById(toastId);

    if (options.actionText && typeof options.onAction === 'function') {
        const actionBtn = toastElement.querySelector('.toast-action-btn');
        if (actionBtn) {
            actionBtn.addEventListener('click', function() {
                options.onAction();
                const bsToast = bootstrap.Toast.getInstance(toastElement);
                if (bsToast) bsToast.hide();
            });
        }
    }

    const delay = options.delay || (options.actionText ? 8000 : (type === 'success' ? 4000 : 6000));

    const toast = new bootstrap.Toast(toastElement, {
        autohide: true,
        delay: delay
    });

    toast.show();

    toastElement.addEventListener('hidden.bs.toast', function() {
        toastElement.remove();
    });
}

function setupIgnoreModal(button) {
    const agentName = button.getAttribute('data-agent-name');
    const itemPathRaw = button.getAttribute('data-item-path');
    const itemName = button.getAttribute('data-item-name');
    const itemPath = itemPathRaw ? itemPathRaw.split(',') : [];

    document.getElementById('ignoreAgentName').textContent = agentName;
    document.getElementById('ignoreItemName').textContent = itemName;

    const confirmBtn = document.getElementById('confirmIgnoreBtn');
    confirmBtn.onclick = function() {
        const modalEl = document.getElementById('ignoreModal');
        const bsModal = bootstrap.Modal.getInstance(modalEl);
        if (bsModal) bsModal.hide();

        fetch('/components/ignore', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                agent_name: agentName,
                item_path: itemPath
            })
        })
        .then(res => res.json())
        .then(response => {
            if (response.success) {
                showToast(`Item ignored on ${escapeHtml(agentName)}`, 'success', {
                    actionText: 'Undo',
                    onAction: () => undoIgnore(agentName, itemPath)
                });
                refreshItemData();
            } else {
                showToast(response.message || 'Failed to ignore item', 'error');
            }
        })
        .catch(err => {
            showToast('Failed to connect to server to ignore item.', 'error');
            console.error('Ignore request failed:', err);
        });
    };
}

function setupDeleteModal(button) {
    const agentName = button.getAttribute('data-agent-name');
    const itemPath = button.getAttribute('data-item-path').split(',');
    const itemName = button.getAttribute('data-item-name');

    // Set modal content
    document.getElementById('deleteAgentName').textContent = agentName;
    document.getElementById('deleteItemName').textContent = itemName;

    // Show loading spinner while fetching item details
    const detailsContainer = document.getElementById('deleteItemDetails');
    detailsContainer.innerHTML = `
        <div class="d-flex align-items-center py-2 text-muted">
            <div class="spinner-border spinner-border-sm me-2" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <span>Fetching item details from agent...</span>
        </div>
    `;

    // Fetch item details dynamically from backend
    fetch('/components/delete-details', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            agent_name: agentName,
            item_path: itemPath
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            const isDirectory = (data.is_dir !== undefined) ? data.is_dir : (data.item_count > 0);

            const typeBadge = isDirectory
                ? '<span class="badge bg-info text-dark">Directory</span>'
                : '<span class="badge bg-secondary">File</span>';

            const formattedSize = formatSizeKb(data.size_kb);
            const contentsInfo = isDirectory
                ? `<p class="mb-1"><strong>Direct Items:</strong> ${data.item_count} ${data.item_count === 1 ? 'item' : 'items'}</p>`
                : '';
            const warningText = isDirectory
                ? `This will permanently delete the directory and all of its contents from <strong>${escapeHtml(data.agent_name)}</strong>'s filesystem.`
                : `This will permanently delete the file from <strong>${escapeHtml(data.agent_name)}</strong>'s filesystem.`;

            detailsContainer.innerHTML = `
                <div class="card bg-body-tertiary border p-3 my-2">
                    <p class="mb-1"><strong>Type:</strong> ${typeBadge}</p>
                    <p class="mb-1"><strong>Size:</strong> ${formattedSize}</p>
                    ${contentsInfo}
                    <p class="mb-0 text-danger small mt-2">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" class="me-1">
                            <path d="M13,13H11V7H13M13,17H11V15H13M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"/>
                        </svg>
                        ${warningText}
                    </p>
                </div>
            `;
        } else {
            detailsContainer.innerHTML = `
                <div class="alert alert-warning py-2 my-2 small">
                    <strong>Note:</strong> ${escapeHtml(data.message || 'Could not fetch full details from agent.')}
                    <br><span class="text-muted">Item will still be deleted from the filesystem if confirmed.</span>
                </div>
            `;
        }
    })
    .catch(error => {
        console.error('Error fetching delete item details:', error);
        detailsContainer.innerHTML = `
            <div class="alert alert-warning py-2 my-2 small">
                <strong>Note:</strong> Could not connect to agent to fetch item metadata.
                <br><span class="text-muted">Item will still be deleted from the filesystem if confirmed.</span>
            </div>
        `;
    });

    // Store data for the actual delete operation
    const confirmBtn = document.getElementById('confirmDeleteBtn');
    confirmBtn.onclick = function() {
        performDelete(agentName, itemPath);
    };
}

function formatSizeKb(sizeKb) {
    if (!sizeKb || sizeKb === 0) return '0 KB';
    const bytes = sizeKb * 1024;
    if (bytes < 1024) return bytes + ' B';
    const kb = bytes / 1024;
    if (kb < 1024) return kb.toFixed(1) + ' KB';
    const mb = kb / 1024;
    if (mb < 1024) return mb.toFixed(1) + ' MB';
    const gb = mb / 1024;
    return gb.toFixed(1) + ' GB';
}

function performDelete(agentName, itemPath) {
    const deleteData = {
        agent_name: agentName,
        item_path: itemPath
    };

    fetch('/components/delete', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(deleteData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Close modal
            const modal = bootstrap.Modal.getInstance(document.getElementById('deleteModal'));
            modal.hide();

            // Show success toast
            showToast('Item deleted successfully', 'success');

            // Refresh item data
            refreshItemData();
        } else {
            // Close modal
            const modal = bootstrap.Modal.getInstance(document.getElementById('deleteModal'));
            modal.hide();

            // Show error toast
            showToast(data.message, 'error');
        }
    })
    .catch(error => {
        // Close modal
        const modal = bootstrap.Modal.getInstance(document.getElementById('deleteModal'));
        modal.hide();

        // Show network error toast
        showToast('Failed to connect to server. Please try again.', 'error');
        console.error('Delete request failed:', error);
    });
}

function toggleSelectAllAgents(masterCheckbox) {
    const checkboxes = document.querySelectorAll('.agent-select-checkbox');
    checkboxes.forEach(cb => {
        cb.checked = masterCheckbox.checked;
    });
    updateBulkToolbarState();
}

function updateBulkToolbarState() {
    const checkboxes = document.querySelectorAll('.agent-select-checkbox');
    const checkedBoxes = document.querySelectorAll('.agent-select-checkbox:checked');
    const toolbar = document.getElementById('bulkActionsToolbar');
    const countBadge = document.getElementById('selectedAgentsCount');
    const selectAllCheckbox = document.getElementById('selectAllAgentsCheckbox');

    if (!toolbar) return;

    const count = checkedBoxes.length;

    if (count > 0) {
        toolbar.classList.remove('d-none');
        if (countBadge) {
            countBadge.textContent = `${count} ${count === 1 ? 'agent' : 'agents'} selected`;
        }
    } else {
        toolbar.classList.add('d-none');
    }

    if (selectAllCheckbox && checkboxes.length > 0) {
        selectAllCheckbox.checked = (count === checkboxes.length);
    }
}

function getSelectedAgentNames() {
    const checkedBoxes = document.querySelectorAll('.agent-select-checkbox:checked');
    return Array.from(checkedBoxes).map(cb => cb.getAttribute('data-agent-name'));
}

function undoIgnore(agentName, itemPath) {
    fetch('/components/unignore', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            agent_name: agentName,
            item_path: itemPath
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showToast(`Un-ignored item on ${escapeHtml(agentName)}`, 'success');
            refreshItemData();
        } else {
            showToast(`Undo failed: ${data.message}`, 'error');
        }
    })
    .catch(error => {
        showToast('Failed to connect to server to undo ignore.', 'error');
        console.error('Undo ignore failed:', error);
    });
}

        showToast('Failed to connect to server for bulk ignore.', 'error');
        console.error('Bulk ignore failed:', error);

// Request cancellation for infopanel
let currentInfoPanelRequest = null;

// Set up global HTMX event handlers for infopanel request management
document.addEventListener('DOMContentLoaded', function() {
    // Cancel existing requests when a new infopanel request is about to start
    document.body.addEventListener('htmx:beforeRequest', function(event) {
        const target = event.detail.target;

        // Check if this is an infopanel request
        if (target && target.id === 'info-panel') {
            // Cancel any existing infopanel request
            if (currentInfoPanelRequest) {
                htmx.trigger(currentInfoPanelRequest, 'htmx:abort');
            }

            // Track this new request
            currentInfoPanelRequest = event.detail.elt;
        }
    });

    // Clear tracking when requests complete
    document.body.addEventListener('htmx:afterRequest', function(event) {
        const target = event.detail.target;
        if (target && target.id === 'info-panel' && currentInfoPanelRequest === event.detail.elt) {
            currentInfoPanelRequest = null;
        }
    });

    // Add current sort order to dynamic items requests
    document.body.addEventListener('htmx:configRequest', function(event) {
        const path = event.detail.path;
        if (path && path.indexOf('/components/dynamic-items.html') !== -1) {
            try {
                const url = new URL(event.detail.path, window.location.origin);
                url.searchParams.delete('sort');
                event.detail.path = url.pathname + url.search;
            } catch (e) {
                // Ignore parse errors
            }
            event.detail.parameters['sort'] = getSortOrder();
        }
    });
});



// URL State Management Functions
function updateUrlWithSelection(selectedId) {
    const url = new URL(window.location);

    if (selectedId) {
        url.searchParams.set('selected', selectedId);
    } else {
        url.searchParams.delete('selected');
    }

    window.history.replaceState({}, '', url);
}

function getSelectionFromUrl() {
    const url = new URL(window.location);
    return url.searchParams.get('selected');
}

function restoreSelectionFromUrl() {
    const selectedId = getSelectionFromUrl();

    if (selectedId) {
        let selectionFound = false;

        if (selectedId.startsWith('parent-item-')) {
            // Level 1 selection
            const selectedElement = document.getElementById(selectedId);
            if (selectedElement) {
                const tab = new bootstrap.Tab(selectedElement);
                tab.show();
                selectedElement.click();
                selectionFound = true;
            }
        } else if (selectedId.startsWith('item-sub1-')) {
            // Level 2 selection - need to activate parent first and wait for lazy loading
            const parts = selectedId.split('-');
            const parentId = `parent-item-${parts[2]}`;

            const parentElement = document.getElementById(parentId);
            if (parentElement) {
                const parentTab = new bootstrap.Tab(parentElement);
                parentTab.show();
                parentElement.click();

                // Wait for parent to lazy load level 2 items
                setTimeout(() => {
                    const selectedElement = document.getElementById(selectedId);
                    if (selectedElement) {
                        const tab = new bootstrap.Tab(selectedElement);
                        tab.show();
                        selectedElement.click();
                        selectionFound = true;
                    } else {
                        // Try waiting a bit longer for lazy loading
                        setTimeout(() => {
                            const selectedElement = document.getElementById(selectedId);
                            if (selectedElement) {
                                const tab = new bootstrap.Tab(selectedElement);
                                tab.show();
                                selectedElement.click();
                                selectionFound = true;
                            } else {
                                showToast('Selected item no longer exists', 'error');
                                // Fall back to parent selection
                                updateUrlWithSelection(parentId);
                            }
                        }, 200);
                    }
                }, 200);
            } else {
                showToast('Selected item no longer exists', 'error');
                clearUrlSelection();
            }
        } else if (selectedId.startsWith('item-sub2-')) {
            // Level 3 selection - need to activate parent and grandparent first with lazy loading
            const parts = selectedId.split('-');
            const grandparentId = `parent-item-${parts[2]}`;
            const parentId = `item-sub1-${parts[2]}-${parts[3]}`;

            const grandparentElement = document.getElementById(grandparentId);
            if (grandparentElement) {
                const grandparentTab = new bootstrap.Tab(grandparentElement);
                grandparentTab.show();
                grandparentElement.click();

                // Wait for grandparent (level 2) to lazy load
                setTimeout(() => {
                    const parentElement = document.getElementById(parentId);
                    if (parentElement) {
                        const parentTab = new bootstrap.Tab(parentElement);
                        parentTab.show();
                        parentElement.click();

                        // Wait for parent (level 3) to lazy load - increased timeout for lazy loading
                        setTimeout(() => {
                            const selectedElement = document.getElementById(selectedId);
                            if (selectedElement) {
                                selectedElement.click();
                                selectionFound = true;
                            } else {
                                // Try waiting a bit longer for lazy loading
                                setTimeout(() => {
                                    const selectedElement = document.getElementById(selectedId);
                                    if (selectedElement) {
                                        selectedElement.click();
                                        selectionFound = true;
                                    } else {
                                        showToast('Selected item no longer exists', 'error');
                                        // Fall back to parent selection
                                        updateUrlWithSelection(parentId);
                                    }
                                }, 200);
                            }
                        }, 300);
                    } else {
                        // Try waiting longer for level 2 lazy loading
                        setTimeout(() => {
                            const parentElement = document.getElementById(parentId);
                            if (parentElement) {
                                const parentTab = new bootstrap.Tab(parentElement);
                                parentTab.show();
                                parentElement.click();

                                setTimeout(() => {
                                    const selectedElement = document.getElementById(selectedId);
                                    if (selectedElement) {
                                        selectedElement.click();
                                        selectionFound = true;
                                    } else {
                                        showToast('Selected item no longer exists', 'error');
                                        updateUrlWithSelection(parentId);
                                    }
                                }, 300);
                            } else {
                                showToast('Selected item no longer exists', 'error');
                                // Fall back to grandparent selection
                                updateUrlWithSelection(grandparentId);
                            }
                        }, 200);
                    }
                }, 200);
            } else {
                showToast('Selected item no longer exists', 'error');
                clearUrlSelection();
            }
        } else {
            // Unknown selection format
            showToast('Invalid selection in URL', 'error');
            clearUrlSelection();
        }

        // For level 1 items, check if selection was found after a short delay to account for dynamic loading
        if (selectedId.startsWith('parent-item-') && !selectionFound) {
            setTimeout(() => {
                if (!document.getElementById(selectedId)) {
                    showToast('Selected item no longer exists', 'error');
                    clearUrlSelection();
                }
            }, 200);
        }
    }
}

function clearUrlSelection() {
    const url = new URL(window.location);
    url.searchParams.delete('selected');
    window.history.replaceState({}, '', url);
}

// Global Fuzzy Search & Facet Filtering Engine
let activeFacetFilter = 'all';

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function fuzzyMatch(text, query) {
    if (!query) return { matches: true, highlightedHTML: escapeHtml(text) };
    const lowerText = text.toLowerCase();
    const lowerQuery = query.toLowerCase();

    // Direct substring match
    const subIdx = lowerText.indexOf(lowerQuery);
    if (subIdx !== -1) {
        const prefix = escapeHtml(text.substring(0, subIdx));
        const match = escapeHtml(text.substring(subIdx, subIdx + query.length));
        const suffix = escapeHtml(text.substring(subIdx + query.length));
        return {
            matches: true,
            highlightedHTML: `${prefix}<mark class="search-highlight">${match}</mark>${suffix}`
        };
    }

    // Subsequence fuzzy match
    let textIdx = 0;
    let queryIdx = 0;
    const highlightIndices = [];

    while (textIdx < text.length && queryIdx < query.length) {
        if (lowerText[textIdx] === lowerQuery[queryIdx]) {
            highlightIndices.push(textIdx);
            queryIdx++;
        }
        textIdx++;
    }

    if (queryIdx === query.length) {
        let result = '';
        let currentPos = 0;
        for (let i = 0; i < highlightIndices.length; i++) {
            const idx = highlightIndices[i];
            if (idx > currentPos) {
                result += escapeHtml(text.substring(currentPos, idx));
            }
            result += `<mark class="search-highlight">${escapeHtml(text[idx])}</mark>`;
            currentPos = idx + 1;
        }
        if (currentPos < text.length) {
            result += escapeHtml(text.substring(currentPos));
        }
        return { matches: true, highlightedHTML: result };
    }

    return { matches: false, highlightedHTML: escapeHtml(text) };
}

function setFacetFilter(filterName) {
    activeFacetFilter = filterName;

    // Update filter buttons UI
    document.querySelectorAll('.filter-pill-btn').forEach(btn => {
        if (btn.getAttribute('data-filter') === filterName) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });

    applySearchAndFilter();
}

function clearSearchInput() {
    const searchInput = document.getElementById('globalSearchInput');
    if (searchInput) {
        searchInput.value = '';
        applySearchAndFilter();
        searchInput.focus();
    }
}

function applySearchAndFilter() {
    const searchInput = document.getElementById('globalSearchInput');
    const query = searchInput ? searchInput.value.trim() : '';

    let totalVisible = 0;
    let totalItems = 0;

    // Process Level 1 items
    const parentItems = document.querySelectorAll('#parentList > a');
    parentItems.forEach(el => {
        totalItems++;
        const name = el.getAttribute('data-name') || el.innerText.trim();
        const isInsufficient = el.getAttribute('data-insufficient') === 'true' || el.classList.contains('list-group-item-warning');

        let passesFacet = true;
        if (activeFacetFilter === 'insufficient') {
            passesFacet = isInsufficient;
        } else if (activeFacetFilter === 'synced') {
            passesFacet = !isInsufficient;
        }

        const matchResult = fuzzyMatch(name, query);
        const titleEl = el.querySelector('.item-title') || el.querySelector('span:not(.badge)');

        if (passesFacet && matchResult.matches) {
            el.classList.remove('d-none');
            totalVisible++;
            if (titleEl) {
                titleEl.innerHTML = matchResult.highlightedHTML;
            }
        } else {
            el.classList.add('d-none');
            if (titleEl) {
                titleEl.innerHTML = escapeHtml(name);
            }
        }
    });

    // Process Level 2 and Level 3 dynamic items if loaded
    const dynamicItems = document.querySelectorAll('#sub1List a, #sub2List a');
    dynamicItems.forEach(el => {
        const name = el.getAttribute('data-name') || el.innerText.trim();
        const isInsufficient = el.getAttribute('data-insufficient') === 'true' || el.classList.contains('list-group-item-warning');

        let passesFacet = true;
        if (activeFacetFilter === 'insufficient') {
            passesFacet = isInsufficient;
        } else if (activeFacetFilter === 'synced') {
            passesFacet = !isInsufficient;
        }

        const matchResult = fuzzyMatch(name, query);
        const titleEl = el.querySelector('.item-title') || el.querySelector('span:not(.badge)');

        if (passesFacet && matchResult.matches) {
            el.classList.remove('d-none');
            if (titleEl) {
                titleEl.innerHTML = matchResult.highlightedHTML;
            }
        } else {
            el.classList.add('d-none');
            if (titleEl) {
                titleEl.innerHTML = escapeHtml(name);
            }
        }
    });

    // Update search result badge UI
    const countBadge = document.getElementById('searchResultCount');
    if (countBadge) {
        if (query !== '' || activeFacetFilter !== 'all') {
            countBadge.textContent = `Showing ${totalVisible} of ${totalItems} categories`;
            countBadge.classList.remove('d-none');
        } else {
            countBadge.classList.add('d-none');
        }
    }
}

// Keyboard Navigation Helper Functions
function getVisibleListItems(containerSelector) {
    const container = document.querySelector(containerSelector);
    if (!container) return [];
    return Array.from(container.querySelectorAll('a:not(.d-none)'));
}

function getCurrentColumnInfo() {
    const activeEl = document.activeElement;
    if (!activeEl) return { col: 1, items: getVisibleListItems('#parentList'), currentIdx: -1 };

    if (activeEl.closest('#parentList')) {
        const items = getVisibleListItems('#parentList');
        return { col: 1, items, currentIdx: items.indexOf(activeEl) };
    }
    if (activeEl.closest('#sub1List')) {
        const activePane = document.querySelector('#sub1List div.tab-pane.active');
        const items = activePane ? Array.from(activePane.querySelectorAll('a:not(.d-none)')) : [];
        return { col: 2, items, currentIdx: items.indexOf(activeEl) };
    }
    if (activeEl.closest('#sub2List')) {
        const activePane = document.querySelector('#sub2List div.tab-pane.active');
        const items = activePane ? Array.from(activePane.querySelectorAll('a:not(.d-none)')) : [];
        return { col: 3, items, currentIdx: items.indexOf(activeEl) };
    }

    const parentItems = getVisibleListItems('#parentList');
    return { col: 1, items: parentItems, currentIdx: -1 };
}

function focusAndSelectListItem(itemEl) {
    if (!itemEl) return;
    document.querySelectorAll('.key-selected').forEach(el => el.classList.remove('key-selected'));
    itemEl.classList.add('key-selected');
    itemEl.focus();
    itemEl.click();
    if (typeof itemEl.scrollIntoView === 'function') {
        itemEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
}

// Global Event Listeners for Search & Keyboard Navigation Shortcuts
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('globalSearchInput');
    if (searchInput) {
        searchInput.addEventListener('input', applySearchAndFilter);
    }

    // Hotkey & Arrow Key Navigation
    document.addEventListener('keydown', function(event) {
        const searchInputEl = document.getElementById('globalSearchInput');
        const activeElement = document.activeElement;
        const isSearchFocused = activeElement === searchInputEl;
        const isInputFocused = activeElement && (
            activeElement.tagName === 'INPUT' ||
            activeElement.tagName === 'TEXTAREA' ||
            activeElement.isContentEditable
        );

        // Hotkey: '/' to focus global search
        if (event.key === '/' && !isInputFocused) {
            event.preventDefault();
            if (searchInputEl) {
                searchInputEl.focus();
                searchInputEl.select();
            }
            return;
        }

        // Hotkey: 'Escape' to dismiss open modals, clear search, or deselect
        if (event.key === 'Escape') {
            const openModalEl = document.querySelector('.modal.show');
            if (openModalEl && typeof bootstrap !== 'undefined') {
                const bsModal = bootstrap.Modal.getInstance(openModalEl);
                if (bsModal) {
                    bsModal.hide();
                    return;
                }
            }

            if (searchInputEl && (isSearchFocused || searchInputEl.value !== '' || activeFacetFilter !== 'all')) {
                searchInputEl.value = '';
                setFacetFilter('all');
                searchInputEl.blur();
                return;
            }

            document.querySelectorAll('.key-selected').forEach(el => el.classList.remove('key-selected'));
            if (activeElement && typeof activeElement.blur === 'function') {
                activeElement.blur();
            }
            return;
        }

        // Search Bar navigation -> Enter or ArrowDown jumps to list items
        if (isSearchFocused && (event.key === 'Enter' || event.key === 'ArrowDown')) {
            event.preventDefault();
            const parentItems = getVisibleListItems('#parentList');
            if (parentItems.length > 0) {
                focusAndSelectListItem(parentItems[0]);
            }
            return;
        }

        // Ignore hotkeys if user is typing in another text input
        if (isInputFocused) return;

        // Arrow Key & Vim Hotkey Navigation for File Tree Columns
        const key = event.key;
        if (['ArrowDown', 'ArrowUp', 'ArrowRight', 'ArrowLeft', 'j', 'k', 'l', 'h', 'Enter'].includes(key)) {
            const { col, items, currentIdx } = getCurrentColumnInfo();

            if (key === 'ArrowDown' || key === 'j') {
                event.preventDefault();
                if (items.length > 0) {
                    const nextIdx = currentIdx < 0 ? 0 : Math.min(currentIdx + 1, items.length - 1);
                    focusAndSelectListItem(items[nextIdx]);
                }
            } else if (key === 'ArrowUp' || key === 'k') {
                event.preventDefault();
                if (items.length > 0) {
                    const prevIdx = currentIdx <= 0 ? 0 : currentIdx - 1;
                    focusAndSelectListItem(items[prevIdx]);
                }
            } else if (key === 'ArrowRight' || key === 'l' || key === 'Enter') {
                event.preventDefault();
                if (col === 1) {
                    const sub1Pane = document.querySelector('#sub1List div.tab-pane.active');
                    const sub1Items = sub1Pane ? Array.from(sub1Pane.querySelectorAll('a:not(.d-none)')) : [];
                    if (sub1Items.length > 0) {
                        focusAndSelectListItem(sub1Items[0]);
                    }
                } else if (col === 2) {
                    const sub2Pane = document.querySelector('#sub2List div.tab-pane.active');
                    const sub2Items = sub2Pane ? Array.from(sub2Pane.querySelectorAll('a:not(.d-none)')) : [];
                    if (sub2Items.length > 0) {
                        focusAndSelectListItem(sub2Items[0]);
                    }
                }
            } else if (key === 'ArrowLeft' || key === 'h') {
                event.preventDefault();
                if (col === 3) {
                    const activeSub1 = document.querySelector('#sub1List div.tab-pane.active a.active') ||
                                       document.querySelector('#sub1List div.tab-pane.active a:not(.d-none)');
                    if (activeSub1) {
                        focusAndSelectListItem(activeSub1);
                    }
                } else if (col === 2) {
                    const activeParent = document.querySelector('#parentList a.active') ||
                                         document.querySelector('#parentList a:not(.d-none)');
                    if (activeParent) {
                        focusAndSelectListItem(activeParent);
                    }
                } else if (col === 1) {
                    if (searchInputEl) {
                        searchInputEl.focus();
                        searchInputEl.select();
                    }
                }
            }
        }
    });

    // Re-sort and re-apply search & filters when HTMX dynamically swaps items
    document.body.addEventListener('htmx:afterSwap', function(event) {
        if (typeof reflowAndSortAllColumns === 'function') {
            reflowAndSortAllColumns(getSortOrder());
        }
        applySearchAndFilter();
    });
});

function toggleAgent(agentName, enabled) {
    const tableContainer = document.getElementById('agents-table-container');
    if (tableContainer) {
        tableContainer.classList.add('loading');
    }
    fetch('/components/agents/toggle', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            agent_name: agentName,
            enabled: enabled
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showToast(data.message, 'success');
            if (tableContainer) {
                fetch('/components/agents-table.html')
                    .then(res => res.text())
                    .then(html => {
                        tableContainer.innerHTML = html;
                        tableContainer.classList.remove('loading');
                    })
                    .catch(err => {
                        console.error('Failed to update agents table:', err);
                        tableContainer.classList.remove('loading');
                    });
            } else {
                refreshItemData();
            }
        } else {
            showToast(data.message || 'Failed to toggle agent state', 'error');
            if (tableContainer) tableContainer.classList.remove('loading');
        }
    })
    .catch(error => {
        showToast('Failed to toggle agent. Connection error.', 'error');
        console.error('Toggle agent request failed:', error);
        if (tableContainer) tableContainer.classList.remove('loading');
    });
}
function updateThemeIcons(theme) {
    const sunIcon = document.getElementById('themeIconSun');
    const moonIcon = document.getElementById('themeIconMoon');
    if (theme === 'dark') {
        if (sunIcon) sunIcon.classList.remove('d-none');
        if (moonIcon) moonIcon.classList.add('d-none');
    } else {
        if (sunIcon) sunIcon.classList.add('d-none');
        if (moonIcon) moonIcon.classList.remove('d-none');
    }
}

function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-bs-theme') || 'light';
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-bs-theme', newTheme);
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    updateThemeIcons(newTheme);
}

document.addEventListener('DOMContentLoaded', () => {
    const currentTheme = document.documentElement.getAttribute('data-bs-theme') || 'light';
    updateThemeIcons(currentTheme);
    const initialSort = getSortOrder();
    updateSortMenuUI(initialSort);
    reflowAndSortAllColumns(initialSort);
});


// Folder Sort Order Management
const VALID_SORT_ORDERS = ['name_asc', 'name_desc', 'size_desc', 'size_asc'];

function getSortOrder() {
    const saved = localStorage.getItem('folderSortOrder');
    return VALID_SORT_ORDERS.includes(saved) ? saved : 'name_asc';
}

function getSortLabel(sortOrder) {
    const labels = {
        'name_asc': 'Name (A → Z)',
        'name_desc': 'Name (Z → A)',
        'size_desc': 'Size (Biggest first)',
        'size_asc': 'Size (Smallest first)'
    };
    return labels[sortOrder] || 'Name (A → Z)';
}

function updateSortMenuUI(sortOrder) {
    const btnLabels = {
        'name_asc': 'Sort: Name (A-Z)',
        'name_desc': 'Sort: Name (Z-A)',
        'size_desc': 'Sort: Size (Biggest)',
        'size_asc': 'Sort: Size (Smallest)'
    };
    const labelEl = document.getElementById('sortMenuLabel');
    if (labelEl) {
        labelEl.textContent = btnLabels[sortOrder] || 'Sort: Name (A-Z)';
    }
    document.querySelectorAll('.sort-option-btn').forEach(btn => {
        if (btn.getAttribute('data-sort') === sortOrder) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
}

function setSortOrder(order) {
    if (!VALID_SORT_ORDERS.includes(order)) return;
    localStorage.setItem('folderSortOrder', order);
    updateSortMenuUI(order);
    reflowAndSortAllColumns(order);
    applySearchAndFilter();
    showToast(`Folder sort order set to: ${getSortLabel(order)}`, 'success');
}

function sortDomListGroup(listGroupEl, sortOrder) {
    if (!listGroupEl) return;
    const items = Array.from(listGroupEl.querySelectorAll(':scope > a[id^="item-sub"]'));
    if (items.length <= 1) return;

    items.sort((a, b) => {
        const nameA = (a.getAttribute('data-name') || '').trim().toLowerCase();
        const nameB = (b.getAttribute('data-name') || '').trim().toLowerCase();
        const sizeA = parseInt(a.getAttribute('data-size-kb') || '0', 10);
        const sizeB = parseInt(b.getAttribute('data-size-kb') || '0', 10);

        if (sortOrder === 'size_desc') {
            if (sizeB !== sizeA) {
                return sizeB - sizeA;
            }
            return nameA.localeCompare(nameB);
        } else if (sortOrder === 'size_asc') {
            if (sizeA !== sizeB) {
                return sizeA - sizeB;
            }
            return nameA.localeCompare(nameB);
        } else if (sortOrder === 'name_desc') {
            return nameB.localeCompare(nameA);
        } else {
            // 'name_asc'
            return nameA.localeCompare(nameB);
        }
    });

    items.forEach(item => listGroupEl.appendChild(item));
}

function reflowAndSortAllColumns(sortOrder) {
    const order = sortOrder || getSortOrder();

    // Re-sort Column 2 list groups
    document.querySelectorAll('#sub1List .list-group').forEach(listGroup => {
        sortDomListGroup(listGroup, order);
    });

    // Re-sort Column 3 list groups
    document.querySelectorAll('#sub2List .list-group').forEach(listGroup => {
        sortDomListGroup(listGroup, order);
    });
}
