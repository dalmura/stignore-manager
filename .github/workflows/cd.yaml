---
name: CD

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  clippy:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Clippy Check
        run: cargo clippy --all-targets --all-features

  rustfmt:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Rustfmt Check
        run: cargo fmt --check

  tests:
    runs-on: ubuntu-24.04
    needs:
      - clippy
      - rustfmt

    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run Tests
        run: cargo test --all-features

  build_container:
    runs-on: ${{ matrix.runner }}
    needs: tests
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    outputs:
      version: ${{ steps.versions.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Extract workspace version
        id: versions
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push manager
        id: docker_build_manager
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/dalmura/stignore-manager:build-${{ steps.versions.outputs.version }}-${{ matrix.arch }}
          target: manager
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push agent
        id: docker_build_agent
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/dalmura/stignore-agent:build-${{ steps.versions.outputs.version }}-${{ matrix.arch }}
          target: agent
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge_and_publish:
    runs-on: ubuntu-24.04
    needs: build_container

    steps:
      - uses: actions/checkout@v5

      - name: Extract workspace version
        id: versions
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and push manager multi-arch image
        run: |
          docker buildx imagetools create \
            -t ghcr.io/dalmura/stignore-manager:latest \
            -t ghcr.io/dalmura/stignore-manager:v${{ steps.versions.outputs.version }} \
            ghcr.io/dalmura/stignore-manager:build-${{ steps.versions.outputs.version }}-amd64 \
            ghcr.io/dalmura/stignore-manager:build-${{ steps.versions.outputs.version }}-arm64

      - name: Merge and push agent multi-arch image
        run: |
          docker buildx imagetools create \
            -t ghcr.io/dalmura/stignore-agent:latest \
            -t ghcr.io/dalmura/stignore-agent:v${{ steps.versions.outputs.version }} \
            ghcr.io/dalmura/stignore-agent:build-${{ steps.versions.outputs.version }}-amd64 \
            ghcr.io/dalmura/stignore-agent:build-${{ steps.versions.outputs.version }}-arm64

  release:
    runs-on: ubuntu-24.04
    needs:
      - tests
      - merge_and_publish

    steps:
      - uses: actions/checkout@v5

      - name: Extract workspace version
        id: versions
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release binaries
        run: cargo build --release --all-features

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.versions.outputs.version }}" \
            --title "Release v${{ steps.versions.outputs.version }}" \
            --generate-notes \
            ./target/release/stignore-manager \
            ./target/release/stignore-agent
