---
name: CD

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  clippy:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Clippy Check
        run: cargo clippy --all-targets --all-features

  rustfmt:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
      - name: Rustfmt Check
        run: cargo fmt --check

  tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run Tests
        run: cargo test --all-features

  build_container:
    runs-on: ${{ matrix.runner }}
    needs:
      - clippy
      - rustfmt
      - tests
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    outputs:
      version: ${{ steps.versions.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Extract workspace version
        id: versions
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for manager
        id: meta_manager
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dalmura/stignore-manager
          labels: |
            org.opencontainers.image.title=stignore-manager
            org.opencontainers.image.description=Centralized web dashboard & aggregator for managing .stignore rules
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/dalmura/stignore-manager

      - name: Extract metadata for agent
        id: meta_agent
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dalmura/stignore-agent
          labels: |
            org.opencontainers.image.title=stignore-agent
            org.opencontainers.image.description=Lightweight storage node agent for .stignore management
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/dalmura/stignore-manager

      - name: Build and push manager
        id: docker_build_manager
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/dalmura/stignore-manager:build-${{ steps.versions.outputs.version }}-${{ matrix.arch }}
          target: manager
          labels: ${{ steps.meta_manager.outputs.labels }}
          annotations: ${{ steps.meta_manager.outputs.annotations }}
          cache-from: type=gha,scope=manager-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=manager-${{ matrix.arch }}

      - name: Build and push agent
        id: docker_build_agent
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/dalmura/stignore-agent:build-${{ steps.versions.outputs.version }}-${{ matrix.arch }}
          target: agent
          labels: ${{ steps.meta_agent.outputs.labels }}
          annotations: ${{ steps.meta_agent.outputs.annotations }}
          cache-from: type=gha,scope=agent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=agent-${{ matrix.arch }}

  merge_and_publish:
    runs-on: ubuntu-24.04
    needs: build_container

    steps:
      - uses: actions/checkout@v5

      - name: Extract workspace version
        id: versions
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and push manager multi-arch image
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=stignore-manager" \
            --annotation "index:org.opencontainers.image.description=Centralized web dashboard & aggregator for managing .stignore rules" \
            --annotation "index:org.opencontainers.image.source=https://github.com/dalmura/stignore-manager" \
            --annotation "index:org.opencontainers.image.url=https://github.com/dalmura/stignore-manager" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-only" \
            --annotation "index:org.opencontainers.image.version=v${{ steps.versions.outputs.version }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t ghcr.io/dalmura/stignore-manager:latest \
            -t ghcr.io/dalmura/stignore-manager:v${{ steps.versions.outputs.version }} \
            ghcr.io/dalmura/stignore-manager:build-${{ steps.versions.outputs.version }}-amd64 \
            ghcr.io/dalmura/stignore-manager:build-${{ steps.versions.outputs.version }}-arm64

      - name: Merge and push agent multi-arch image
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=stignore-agent" \
            --annotation "index:org.opencontainers.image.description=Lightweight storage node agent for .stignore management" \
            --annotation "index:org.opencontainers.image.source=https://github.com/dalmura/stignore-manager" \
            --annotation "index:org.opencontainers.image.url=https://github.com/dalmura/stignore-manager" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-only" \
            --annotation "index:org.opencontainers.image.version=v${{ steps.versions.outputs.version }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t ghcr.io/dalmura/stignore-agent:latest \
            -t ghcr.io/dalmura/stignore-agent:v${{ steps.versions.outputs.version }} \
            ghcr.io/dalmura/stignore-agent:build-${{ steps.versions.outputs.version }}-amd64 \
            ghcr.io/dalmura/stignore-agent:build-${{ steps.versions.outputs.version }}-arm64

  release:
    runs-on: ubuntu-24.04
    needs:
      - clippy
      - rustfmt
      - tests
      - merge_and_publish

    steps:
      - uses: actions/checkout@v5

      - name: Extract workspace version
        id: versions
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release binaries
        run: cargo build --release --all-features

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.versions.outputs.version }}" \
            --title "Release v${{ steps.versions.outputs.version }}" \
            --generate-notes \
            ./target/release/stignore-manager \
            ./target/release/stignore-agent
