---
name: CD

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build_container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: SebRollen/toml-action@v1.2.0
        id: version_manager
        with:
          file: 'manager/Cargo.toml'
          field: 'package.version'

      - uses: SebRollen/toml-action@v1.2.0
        id: version_agent
        with:
          file: 'agent/Cargo.toml'
          field: 'package.version'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push manager
        id: docker_build_manager
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dalmura/stignore-manager:latest
            ghcr.io/dalmura/stignore-manager:v${{ steps.version_manager.outputs.value }}
          target: manager
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push agent
        id: docker_build_agent
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dalmura/stignore-agent:latest
            ghcr.io/dalmura/stignore-agent:v${{ steps.version_agent.outputs.value }}
          target: agent
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: SebRollen/toml-action@v1.2.0
        id: version_manager
        with:
          file: 'manager/Cargo.toml'
          field: 'package.version'

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build
        run: cargo build --release --all-features

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.version_manager.outputs.value }}
          name: Release v${{ steps.version_manager.outputs.value }}
          generate_release_notes: true
          files: |
            ./target/release/stignore-manager
            ./target/release/stignore-agent
