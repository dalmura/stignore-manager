---
name: CD

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build_container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Extract crate versions
        id: versions
        run: |
          MANAGER_VER=$(python3 -c "import tomllib; print(tomllib.load(open('manager/Cargo.toml', 'rb'))['package']['version'])")
          AGENT_VER=$(python3 -c "import tomllib; print(tomllib.load(open('agent/Cargo.toml', 'rb'))['package']['version'])")
          echo "manager=${MANAGER_VER}" >> "$GITHUB_OUTPUT"
          echo "agent=${AGENT_VER}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push manager
        id: docker_build_manager
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dalmura/stignore-manager:latest
            ghcr.io/dalmura/stignore-manager:v${{ steps.versions.outputs.manager }}
          target: manager
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push agent
        id: docker_build_agent
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dalmura/stignore-agent:latest
            ghcr.io/dalmura/stignore-agent:v${{ steps.versions.outputs.agent }}
          target: agent
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Extract manager version
        id: versions
        run: |
          MANAGER_VER=$(python3 -c "import tomllib; print(tomllib.load(open('manager/Cargo.toml', 'rb'))['package']['version'])")
          echo "manager=${MANAGER_VER}" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release binaries
        run: cargo build --release --all-features

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.versions.outputs.manager }}" \
            --title "Release v${{ steps.versions.outputs.manager }}" \
            --generate-notes \
            ./target/release/stignore-manager \
            ./target/release/stignore-agent
